[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indobenchmark-toolkit"
dynamic = ["version"]
description = "Indobenchmark toolkit for supporting IndoNLU and IndoNLG"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Cahyawijaya", email = "samuel.cahyawijaya@gmail.com" },
]
dependencies = [
    "transformers>=5,<6",
    "sentencepiece>=0.1.95",
    "datasets>=1.4.1",
    "torch>=1.7.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/SamuelCahyawijaya/indobenchmark-toolkit"
Issues = "https://github.com/SamuelCahyawijaya/indobenchmark-toolkit/issues"

[dependency-groups]
publish = [
    "twine>=6.0.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "indobenchmark.version.__version__" }
